version: 1.0

# Issues are specs in the GitHub tracker; review pull requests only.
issues: false

user_settings:
  # Wait until a draft PR is marked ready for review (matches docs/quality-gates.md).
  review_drafts: false
  min_severity: minor
  # Report blockers, majors, minors corroborated by two reviewers or a repo rule,
  # and nits only when they cite a repo rule.
  report_floor: corroborated-minor
  skeptic_pass: true

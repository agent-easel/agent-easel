name: Run controlled UI journeys

on:
  workflow_call:
    inputs:
      sha:
        description: Exact commit to test
        required: true
        type: string

permissions:
  contents: read

jobs:
  shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Each shard has its own seeded fixture. Workers within a shard share that fixture.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e:prepare
      - name: Install Chromium
        run: pnpm exec e2e-web install chromium
      - name: Check controlled UI journeys
        run: pnpm exec e2e run --shard ${{ matrix.shard }}/3 --retries 0 --trace on --output .e2e/ci/journeys
      - name: Keep failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-journeys-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: |
            .e2e/ci/
            .e2e/logs/
          include-hidden-files: true
          retention-days: 7

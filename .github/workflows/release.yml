name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to rebuild and publish (vX.Y.Z)
        required: true
        type: string

permissions: {}

jobs:
  release-please:
    name: Release PR and cut
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  source:
    name: Resolve release source
    needs: release-please
    if: >-
      !cancelled() && needs.release-please.result != 'failure' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Listing draft releases requires push access; this job runs no repository code.
    permissions:
      contents: write
      checks: read
      pull-requests: read
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      checked: ${{ steps.checked.outputs.checked }}
    steps:
      - id: source
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHED_TAG: ${{ inputs.tag }}
          CUT_TAG: ${{ needs.release-please.outputs.tag }}
          CUT_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          tag=${CUT_TAG:-$DISPATCHED_TAG}
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must look like vX.Y.Z, got '$tag'."
            exit 1
          fi
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$tag\") | {draft, target: .target_commitish}" | jq -s .)
          if [[ "$(jq length <<<"$releases")" != 1 ]]; then
            echo "::error::Expected exactly one release for $tag, found $(jq length <<<"$releases")."
            exit 1
          fi
          if [[ "$(jq -r '.[0].draft' <<<"$releases")" != true ]]; then
            echo "::error::$tag is already published; published releases are never rebuilt or replaced."
            exit 1
          fi
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          if [[ "$(jq -r '.[0].target' <<<"$releases")" != "$sha" ]]; then
            echo "::error::The $tag draft does not target the tagged commit $sha."
            exit 1
          fi
          if [[ -n "$CUT_SHA" && "$CUT_SHA" != "$sha" ]]; then
            echo "::error::$tag points to $sha, not the release commit $CUT_SHA."
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"
      - id: checked
        name: Reuse checks of the Release PR
        # The ruleset does not require PRs to be up to date, so the merged tree can differ from the
        # tested PR head; only an identical tree with passing required checks lets the build skip them.
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.source.outputs.sha }}
        run: |
          checked=false
          tree=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq .commit.tree.sha)
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].head.sha // ""')
          if [[ -z "$head" ]]; then
            reason="no merged pull request produced $SHA"
          elif [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$head" --jq .commit.tree.sha)" != "$tree" ]]; then
            reason="the Release PR head $head was not up to date with main when merged"
          else
            reason=""
            for check in "Quality gate" "Controlled UI journeys"; do
              conclusions=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/check-runs?filter=latest&per_page=100" \
                --jq "[.check_runs[] | select(.name == \"$check\" and .app.slug == \"github-actions\") | .conclusion] | unique | join(\",\")")
              if [[ "$conclusions" != success ]]; then
                reason="'$check' on $head is '${conclusions:-missing}'"
                break
              fi
            done
            if [[ -z "$reason" ]]; then checked=true; fi
          fi
          echo "checked=$checked" >> "$GITHUB_OUTPUT"
          if [[ "$checked" = true ]]; then
            echo "Release tree passed Quality gate and Controlled UI journeys on $head; the build skips them." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The build runs the quality gate and browser journeys: $reason." >> "$GITHUB_STEP_SUMMARY"
          fi

  build-macos:
    name: Build
    needs: source
    if: ${{ !cancelled() && needs.source.result == 'success' }}
    concurrency:
      group: release-build-${{ needs.source.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-build.yml
    with:
      sha: ${{ needs.source.outputs.sha }}
      channel: release
      release-version: ${{ needs.source.outputs.version }}
      run-checks: ${{ needs.source.outputs.checked != 'true' }}
    secrets:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  publish:
    name: Publish release
    needs: [source, build-macos]
    if: ${{ !cancelled() && needs.build-macos.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: release-publish-${{ needs.source.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.source.outputs.tag }}
      RELEASE_SHA: ${{ needs.source.outputs.sha }}
      RELEASE_VERSION: ${{ needs.source.outputs.version }}
      PRODUCT_STATEMENT: >-
        T3 Factory requires T3 Code. Every agent task in a Run is carried out in a T3 Code thread, and T3 Factory does not work without a T3 Code installation. T3 Factory is an independent, unofficial project. It is not affiliated with, endorsed by, or sponsored by T3 Tools, Inc. T3 Code is a trademark of T3 Tools, Inc.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.source.outputs.tag }}
          path: downloads
      - name: Verify downloads
        working-directory: downloads
        run: |
          base="T3.Factory-$RELEASE_VERSION-arm64"
          printf '%s\n' "$base.dmg" "$base.dmg.blockmap" "$base.zip" "$base.zip.blockmap" \
            SHA256SUMS.txt latest-mac.yml | sort > ../expected-files.txt
          ls -1 | sort > ../actual-files.txt
          diff -u ../expected-files.txt ../actual-files.txt
          sha256sum --check --strict SHA256SUMS.txt
          test "$(awk '{print $2}' SHA256SUMS.txt | sort)" = "$(grep -v '^SHA256SUMS.txt$' ../expected-files.txt)"
          grep -qx "version: $RELEASE_VERSION" latest-mac.yml
      - name: Check release is still an unchanged draft
        run: |
          release=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | {id, draft, target: .target_commitish}" | jq -s .)
          test "$(jq length <<<"$release")" = 1
          if [[ "$(jq -r '.[0].draft' <<<"$release")" != true ]]; then
            echo "::error::$RELEASE_TAG was published outside this job; its assets are not changed."
            exit 1
          fi
          test "$(jq -r '.[0].target' <<<"$release")" = "$RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)" = "$RELEASE_SHA"
          echo "RELEASE_ID=$(jq -r '.[0].id' <<<"$release")" >> "$GITHUB_ENV"
      - name: Upload the complete asset set
        run: |
          # Only assets of a still-draft release left by an earlier failed attempt are removed.
          for asset in $(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq '.[].id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset"
          done
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" downloads/*
      - name: Verify uploaded assets
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[] | "\(.digest | sub("^sha256:"; ""))  \(.name)"' | sort -k2 > uploaded.txt
          (cd downloads && sha256sum -- *) | sort -k2 > local.txt
          diff -u local.txt uploaded.txt
      - name: Add GitHub contributor notes
        run: |
          body=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .body)
          if grep -q '^\*\*Full Changelog\*\*' <<<"$body"; then
            exit 0
          fi
          # Compare with the previous stable release, not the latest beta.
          previous=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select((.draft | not) and (.prerelease | not) and .tag_name != \"$RELEASE_TAG\" and (.tag_name | test(\"^v[0-9]+\\\\.[0-9]+\\\\.[0-9]+$\"))) | .tag_name" \
            | head -n 1)
          args=(-f tag_name="$RELEASE_TAG" -f target_commitish="$RELEASE_SHA")
          if [[ -n "$previous" ]]; then
            args+=(-f previous_tag_name="$previous")
          fi
          notes=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body)
          printf '%s\n\n%s\n' "$body" "$notes" > release-body.md
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-body.md
      - name: Add the product statement
        run: |
          body=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .body)
          statement=$PRODUCT_STATEMENT
          if grep -qF "$statement" <<<"$body"; then
            exit 0
          fi
          printf '%s\n\n---\n\n%s\n' "$body" "$statement" > release-body.md
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-body.md
      - name: Publish
        run: |
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          test "$(jq -r .draft <<<"$release")" = false
          test "$(jq -r .tag_name <<<"$release")" = "$RELEASE_TAG"
          jq -r '.assets[] | "\(.digest | sub("^sha256:"; ""))  \(.name)"' <<<"$release" | sort -k2 > published.txt
          diff -u local.txt published.txt
          jq -r '"Published release: " + .html_url' <<<"$release" >> "$GITHUB_STEP_SUMMARY"

  landing:
    name: Deploy landing page to Vercel
    needs: [source, publish]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.publish.result == 'success' ||
      (github.event_name == 'push' && needs.publish.result == 'skipped' && needs.source.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: landing-production
      url: https://t3factory.app/
    concurrency:
      group: landing-production
      queue: max
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Select a build with a public Release download
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          PUBLISHED_TAG: ${{ needs.source.outputs.tag }}
        run: |
          if [[ -z "$PUBLISHED_TAG" ]]; then
            before_version=$(git show "$BEFORE:package.json" | jq -er .version)
            push_version=$(git show "$PUSH_SHA:package.json" | jq -er .version)
            changes=$(git diff --name-only "$BEFORE" "$PUSH_SHA" -- apps/landing)
            if [[ "$before_version" == "$push_version" && -z "$changes" ]]; then
              exit 0
            fi
          fi

          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")
          tag=$(jq -er '.tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' <<<"$release")
          if [[ -n "$PUBLISHED_TAG" && "$PUBLISHED_TAG" != "$tag" ]]; then
            echo "Skipping $PUBLISHED_TAG because $tag is now the latest Release."
            exit 0
          fi

          version=${tag#v}
          if [[ "$(jq -er .version package.json)" != "$version" ]]; then
            if [[ -z "$PUBLISHED_TAG" ]]; then
              echo "Landing changes will deploy after the Release for the current main version is published."
              exit 0
            fi
            git checkout --detach "$tag"
            git merge-base --is-ancestor HEAD origin/main
            test "$(jq -er .version package.json)" = "$version"
          fi

          for name in "T3.Factory-$version-arm64.dmg" SHA256SUMS.txt; do
            download="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$name"
            jq -e --arg url "$download" 'any(.assets[]; .state == "uploaded" and .browser_download_url == $url)' <<<"$release" > /dev/null
            curl --fail --silent --show-error --head --location --retry 3 "$download" > /dev/null
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - if: steps.site.outputs.tag != ''
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.site.outputs.tag != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Build and deploy the verified landing page
        if: steps.site.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.site.outputs.tag }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          : "${VERCEL_ORG_ID:?}" "${VERCEL_PROJECT_ID:?}" "${VERCEL_TOKEN:?}"
          npx --yes vercel@66.6.0 pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx --yes vercel@66.6.0 build --prod --token "$VERCEL_TOKEN"
          index=.vercel/output/static/index.html
          grep -Fq 'rel="canonical" href="https://t3factory.app/"' "$index"
          grep -Fq "/releases/download/$RELEASE_TAG/T3.Factory-${RELEASE_TAG#v}-arm64.dmg" "$index"
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [[ "$latest" == "$RELEASE_TAG" ]]; then
            npx --yes vercel@66.6.0 deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
          fi

name: UI journeys

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ui-journeys-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Select controlled UI journeys
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/select-ui-journeys.mjs "$BASE_SHA" "$HEAD_SHA"

  journeys:
    needs: select
    if: needs.select.outputs.run == 'true'
    uses: ./.github/workflows/run-ui-journeys.yml
    with:
      sha: ${{ github.sha }}

  result:
    name: Controlled UI journeys
    needs: [select, journeys]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require a successful journey run or explicit no-run decision
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          RUN_JOURNEYS: ${{ needs.select.outputs.run }}
          JOURNEYS_RESULT: ${{ needs.journeys.result }}
        run: |
          if [[ "$SELECT_RESULT" == success ]] && {
            [[ "$RUN_JOURNEYS" == false && "$JOURNEYS_RESULT" == skipped ]] ||
            [[ "$RUN_JOURNEYS" == true && "$JOURNEYS_RESULT" == success ]]
          }; then
            echo "Controlled UI journeys: run=$RUN_JOURNEYS, result=$JOURNEYS_RESULT"
          else
            echo "::error::Controlled UI journeys did not pass: selection=$SELECT_RESULT, run=$RUN_JOURNEYS, journeys=$JOURNEYS_RESULT"
            exit 1
          fi
      # A docs-only success does not certify a tree for Beta.
      - name: Full UI suite passed on ${{ github.sha }}
        if: needs.journeys.result == 'success'
        run: echo 'Every Chromium shard passed.'
